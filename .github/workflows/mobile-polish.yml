name: One-time Farabi Mobile Polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: ${{ !contains(github.event.head_commit.message, 'Farabi mobile polish') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enhance mobile UX and animations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('farabi/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* FARABI MOBILE POLISH v2 */'
          if marker not in s:
              css = '''/* FARABI MOBILE POLISH v2 */
          .reveal{opacity:0;transform:translateY(28px) scale(.98);filter:blur(7px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1),filter .7s ease}.reveal.show{opacity:1;transform:none;filter:none}.hero .reveal:first-child{transition-delay:.08s}.visual.reveal{transition-delay:.18s}.card.reveal:nth-child(2){transition-delay:.06s}.card.reveal:nth-child(3){transition-delay:.12s}.card.reveal:nth-child(4){transition-delay:.18s}.card.reveal:nth-child(5){transition-delay:.24s}.card.reveal:nth-child(6){transition-delay:.30s}.button,.developer-button,.cta{position:relative;overflow:hidden;transition:transform .25s ease,box-shadow .25s ease,background .25s ease}.button:hover,.developer-button:hover,.cta:hover{transform:translateY(-3px);box-shadow:0 12px 30px #00321e22}.button:active,.developer-button:active,.cta:active{transform:scale(.96)}.button::after,.developer-button::after,.cta::after{content:"";position:absolute;inset:-60% -20%;background:linear-gradient(110deg,transparent 35%,#ffffff55 48%,transparent 60%);transform:translateX(-70%);transition:transform .7s ease}.button:hover::after,.developer-button:hover::after,.cta:hover::after{transform:translateX(70%)}.card{will-change:transform}.card:active{transform:scale(.985)}.glass{animation:glassFloat 6s ease-in-out infinite;will-change:transform}.orb{will-change:transform,filter}.chip{animation:chipFloat 4.5s ease-in-out infinite}.b{animation-delay:-1.8s}.nav{position:sticky}.nav::after{content:"";position:absolute;left:0;bottom:-1px;width:calc(var(--scroll,0) * 100%);height:2px;background:var(--g2);transform-origin:left;transition:width .08s linear}@keyframes glassFloat{0%,100%{translate:0 0 rotate(4deg)}50%{translate:0 -10px rotate(2deg)}}@keyframes chipFloat{0%,100%{translate:0 0}50%{translate:0 -7px}}@media(max-width:850px){.nav{padding:12px 4vw;gap:10px}.nav nav{display:flex;align-items:center;gap:6px;overflow-x:auto;max-width:58vw;scrollbar-width:none}.nav nav::-webkit-scrollbar{display:none}.nav a{margin-left:0;white-space:nowrap;font-size:12px;padding:8px 10px}.nav .cta{padding:9px 12px}.hero{min-height:auto;padding:64px 6vw 45px;gap:20px}.hero h1{font-size:clamp(42px,12vw,68px);line-height:1.02;margin:16px 0}.hero p{font-size:15px;line-height:1.75}.buttons{flex-wrap:wrap;margin:22px 0}.button{padding:13px 17px}.visual{height:360px}.orb{width:min(78vw,330px);height:min(78vw,330px)}.glass{width:min(68vw,275px);height:min(78vw,330px);padding:24px;border-radius:32px}.glass strong{font-size:48px}.chip{font-size:11px;padding:9px 12px}.section{padding:70px 6vw}.head h2{font-size:clamp(38px,10vw,58px)}.grid{grid-template-columns:1fr 1fr;gap:10px}.card{padding:20px;border-radius:20px;min-height:175px}.card h3{font-size:17px}.card p{font-size:13px}.icon{width:40px;height:40px;margin-bottom:20px}.row{grid-template-columns:34px 1fr 22px;gap:12px;padding:20px 0}.apply{gap:35px}.form{padding:22px;border-radius:24px}.footer{padding:38px 6vw}.developer-actions{gap:8px}.developer-button{padding:10px 13px}}
          @media(max-width:560px){body{overflow-x:hidden}.nav{padding-top:max(10px,env(safe-area-inset-top));}.brand{font-size:13px}.mark{width:38px;height:38px;border-radius:11px}.brand small{font-size:9px}.nav nav{max-width:62vw}.hero{padding-top:52px}.hero .reveal:first-child{transition-delay:0}.visual{height:320px}.glass{width:220px;height:285px}.glass strong{font-size:42px}.grid{grid-template-columns:1fr}.card{min-height:0}.card p{margin-bottom:0}.training{padding-left:6vw;padding-right:6vw}.rows{width:100%}.apply h2{font-size:clamp(38px,10vw,52px)}.formrow{grid-template-columns:1fr}.input,select,textarea{font-size:16px}.developer-actions{width:100%}.developer-button{flex:1;min-width:135px}.developer-button img{width:17px;height:17px}}
          @media(hover:none){.button:hover,.developer-button:hover,.cta:hover{transform:none;box-shadow:none}.card:hover{transform:none;box-shadow:0 5px 25px #00321e08}.button:active,.developer-button:active,.cta:active{transform:scale(.96);box-shadow:0 8px 20px #00321e22}}
          @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.001ms!important}.reveal{opacity:1!important;transform:none!important;filter:none!important}}
          '''
              s = s.replace('</style>', css + '</style>', 1)
              js = '''\n/* FARABI MOBILE POLISH v2 JS */\n(function(){\n  const setScroll=()=>document.documentElement.style.setProperty('--scroll',Math.min(1,scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight)));\n  addEventListener('scroll',setScroll,{passive:true});setScroll();\n  if(matchMedia('(pointer:fine)').matches){\n    const cardTilt=(el)=>{el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;el.style.transform=`translateY(-5px) perspective(700px) rotateX(${-y*3}deg) rotateY(${x*3}deg)`});el.addEventListener('pointerleave',()=>el.style.transform='');};\n    document.querySelectorAll('.card').forEach(cardTilt);\n  }\n  document.querySelectorAll('.button,.developer-button,.cta').forEach(el=>el.addEventListener('pointerdown',()=>{el.classList.add('pressed');setTimeout(()=>el.classList.remove('pressed'),180)}));\n})();\n'''
              s = s.replace('</script>', js + '</script>', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit polished source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add farabi/index.html
          git diff --cached --quiet || git commit -m "Farabi mobile polish"
          git push

      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/mobile-polish.yml
          git commit -m "Remove one-time mobile polish workflow"
          git push
