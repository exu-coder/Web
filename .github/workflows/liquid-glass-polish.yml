name: One-time iPhone Liquid Glass Polish

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply liquid glass design
        shell: python
        run: |
          from pathlib import Path
          p = Path('farabi/index.html')
          s = p.read_text(encoding='utf-8')
          css = r'''
          /* FARABI iPHONE LIQUID GLASS v3 */
          :root{--glass-bg:rgba(255,255,255,.48);--glass-bg-strong:rgba(255,255,255,.68);--glass-line:rgba(255,255,255,.72);--glass-shadow:0 24px 70px rgba(4,52,35,.13);--glass-blur:24px}
          body{background:radial-gradient(circle at 8% 8%,rgba(183,214,92,.20),transparent 28%),radial-gradient(circle at 92% 18%,rgba(117,178,139,.18),transparent 30%),#f3f4e9;background-attachment:fixed}
          body::before{content:"";position:fixed;inset:-20%;z-index:-2;pointer-events:none;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.75),transparent 25%),radial-gradient(circle at 70% 65%,rgba(183,214,92,.14),transparent 24%);filter:blur(55px);animation:liquidDrift 16s ease-in-out infinite alternate}
          .nav{background:rgba(243,244,233,.58);border-bottom:1px solid rgba(255,255,255,.72);box-shadow:0 8px 30px rgba(0,50,30,.06);backdrop-filter:blur(24px) saturate(145%);-webkit-backdrop-filter:blur(24px) saturate(145%)}
          .brand .mark{box-shadow:inset 0 1px rgba(255,255,255,.25),0 10px 25px rgba(6,59,42,.18)}
          .hero h1{ text-shadow:0 2px 25px rgba(255,255,255,.7)}
          .button,.cta,.developer-button{border:1px solid rgba(255,255,255,.48);box-shadow:inset 0 1px rgba(255,255,255,.28),0 12px 30px rgba(0,50,30,.10);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
          .secondary{background:rgba(255,255,255,.38);box-shadow:inset 0 1px rgba(255,255,255,.72),0 10px 25px rgba(0,50,30,.07)}
          .visual{perspective:1100px}
          .orb{box-shadow:0 0 90px rgba(117,178,139,.24),inset -30px -30px 70px rgba(0,40,25,.12),inset 25px 20px 50px rgba(255,255,255,.34);filter:saturate(112%)}
          .glass{background:linear-gradient(135deg,rgba(255,255,255,.36),rgba(255,255,255,.12));border:1px solid var(--glass-line);box-shadow:inset 0 1px rgba(255,255,255,.85),inset 0 -20px 50px rgba(255,255,255,.06),0 35px 90px rgba(0,50,30,.18);backdrop-filter:blur(28px) saturate(145%);-webkit-backdrop-filter:blur(28px) saturate(145%);transform-style:preserve-3d}
          .glass::before{content:"";position:absolute;inset:1px;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.48),transparent 35%,transparent 65%,rgba(255,255,255,.12));opacity:.7}
          .glass::after{content:"";position:absolute;width:120px;height:120px;top:-65px;right:-40px;border-radius:50%;background:rgba(255,255,255,.20);filter:blur(18px);pointer-events:none}
          .chip{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.8);box-shadow:inset 0 1px rgba(255,255,255,.9),0 16px 35px rgba(0,40,25,.12);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%)}
          .card,.form{background:linear-gradient(145deg,rgba(255,255,255,.78),rgba(255,255,255,.54));border:1px solid rgba(255,255,255,.76);box-shadow:inset 0 1px rgba(255,255,255,.9),0 18px 50px rgba(0,50,30,.08);backdrop-filter:blur(20px) saturate(125%);-webkit-backdrop-filter:blur(20px) saturate(125%)}
          .card:hover{box-shadow:inset 0 1px rgba(255,255,255,.9),0 28px 65px rgba(0,50,30,.13)}
          input,select,textarea{background:rgba(255,255,255,.52);border-color:rgba(16,36,28,.12);box-shadow:inset 0 1px rgba(255,255,255,.8)}
          input:focus,select:focus,textarea:focus{border-color:rgba(13,99,70,.42);box-shadow:0 0 0 4px rgba(13,99,70,.08),inset 0 1px rgba(255,255,255,.8)}
          .training{background:linear-gradient(145deg,rgba(6,59,42,.96),rgba(13,99,70,.90));box-shadow:inset 0 1px rgba(255,255,255,.14),0 30px 80px rgba(0,50,30,.14)}
          @keyframes liquidDrift{from{transform:translate3d(-2%, -1%,0) scale(1)}to{transform:translate3d(3%,2%,0) scale(1.05)}}
          @media(max-width:850px){body::before{animation-duration:20s}.nav{box-shadow:0 5px 22px rgba(0,50,30,.07)}.glass{backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%)}.card,.form{backdrop-filter:blur(16px) saturate(120%);-webkit-backdrop-filter:blur(16px) saturate(120%)}.button:active,.developer-button:active,.cta:active{box-shadow:inset 0 2px 8px rgba(0,40,25,.12),0 5px 14px rgba(0,50,30,.10)}}
          @media(max-width:560px){body{background-attachment:scroll}.nav{background:rgba(243,244,233,.76);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%)}.hero h1{text-shadow:0 2px 18px rgba(255,255,255,.75)}.glass{box-shadow:inset 0 1px rgba(255,255,255,.85),0 24px 60px rgba(0,50,30,.17)}.chip{box-shadow:inset 0 1px rgba(255,255,255,.9),0 12px 28px rgba(0,40,25,.10)}}
          @media(prefers-reduced-motion:reduce){body::before{animation:none!important}}
          '''
          marker='/* FARABI iPHONE LIQUID GLASS v3 */'
          if marker not in s:
              s=s.replace('</style>', css+'\n</style>',1)
          js = r'''
          <script>
          (()=>{
            const root=document.documentElement;
            const update=()=>root.style.setProperty('--scroll',Math.min(1,scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight)));
            addEventListener('scroll',update,{passive:true});update();
            if(matchMedia('(hover:hover) and (pointer:fine)').matches){
              const card=document.querySelector('.glass');
              const visual=document.querySelector('.visual');
              if(card&&visual){visual.addEventListener('pointermove',e=>{const r=visual.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;card.style.transform=`rotateX(${-y*7}deg) rotateY(${x*9}deg) rotateZ(2deg) translateZ(8px)`});visual.addEventListener('pointerleave',()=>card.style.transform='rotate(4deg)')}
            }
          })();
          </script>
          '''
          if 'const root=document.documentElement' not in s:
              s=s.replace('</body>',js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')

      - name: Commit polished source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add farabi/index.html
          git diff --cached --quiet || git commit -m "Apply iPhone-style liquid glass UI"
          git push

      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/liquid-glass-polish.yml
          git commit -m "Remove one-time liquid glass workflow"
          git push
