name: Remove admin login subtitle

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-subtitle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove only the MongoDB Atlas subtitle
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/admin/index.html')
          s = p.read_text(encoding='utf-8')
          old = '<p>MongoDB Atlas • Liquid Glass Admin</p>'
          if old not in s:
              raise SystemExit('Target text not found')
          s = s.replace(old, '', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/admin/index.html
          git commit -m 'Remove MongoDB Atlas subtitle from admin login'
          git push
