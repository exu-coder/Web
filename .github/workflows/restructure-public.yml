name: Sync public structure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy site into public
        shell: bash
        run: |
          set -e
          mkdir -p public/admin
          cp farabi/index.html public/index.html
          cp farabi/app.js public/app.js
          cp farabi/supabase-apply.js public/supabase-apply.js
          cp 'farabi/farabi@/index.html' public/admin/index.html
          cp 'farabi/farabi@/main.js' public/admin/main.js
          cp 'farabi/farabi@/admin.css' public/admin/admin.css
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public
          if git diff --cached --quiet; then echo 'public already synced'; else git commit -m 'Sync Farabi panels into public'; git push; fi
