name: Finalize public structure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restructure:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move Farabi site into public
        shell: bash
        run: |
          set -e
          mkdir -p public/admin

          # User panel
          if [ -f farabi/index.html ]; then cp farabi/index.html public/index.html; fi
          if [ -f farabi/app.js ]; then cp farabi/app.js public/app.js; fi
          if [ -f farabi/supabase-apply.js ]; then cp farabi/supabase-apply.js public/supabase-apply.js; fi

          # Admin panel
          if [ -f 'farabi/farabi@/index.html' ]; then cp 'farabi/farabi@/index.html' public/admin/index.html; fi
          if [ -f 'farabi/farabi@/main.js' ]; then cp 'farabi/farabi@/main.js' public/admin/main.js; fi
          if [ -f 'farabi/farabi@/admin.css' ]; then cp 'farabi/farabi@/admin.css' public/admin/admin.css; fi

          # Remove the old nested source after copying.
          rm -rf farabi
          rm -f public/index.html.tmp

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No restructuring changes needed.'
          else
            git commit -m 'Restructure site into public with server routing'
            git push
          fi
