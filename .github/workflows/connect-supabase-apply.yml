name: Connect Farabi Apply Form

on:
  workflow_dispatch:
  push:
    paths:
      - 'farabi/supabase-apply.js'

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Supabase script into Farabi page
        shell: python
        run: |
          from pathlib import Path
          path = Path('farabi/index.html')
          html = path.read_text(encoding='utf-8')
          tag = '<script src="supabase-apply.js" defer></script>'
          if tag not in html:
              marker = '</body>'
              if marker not in html:
                  raise SystemExit('Could not find </body> in farabi/index.html')
              html = html.replace(marker, tag + marker, 1)
              path.write_text(html, encoding='utf-8')
          print('Supabase apply script is connected.')

      - name: Commit integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add farabi/index.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Wire Farabi apply form to Supabase [skip ci]'
          git push
